name: Deploy the Cloud copy

# Deploys the web app (the Cloud copy) to Cloudflare Workers whenever main
# changes. Cloudflare's own Git integration was never connected, so merges
# used to deploy nothing. Needs the repository secret CLOUDFLARE_API_TOKEN
# (a Cloudflare API token allowed to edit Workers Scripts and D1).
# The repository secret CLINIC_SYNC_DEVICE_KEY is the one device key: this
# sets it on the Worker, and the installer workflow builds it into the app.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloud-copy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and deploy to Cloudflare Workers
        run: npx vinext-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 59cf833536bd9a751546ecfc2cc649e3

      - name: Give the Cloud copy the device key
        if: env.CLINIC_SYNC_DEVICE_KEY != ''
        run: printf '%s' "$CLINIC_SYNC_DEVICE_KEY" | npx wrangler secret put CLINIC_SYNC_DEVICE_KEY --name vishwas-clinic-demo
        env:
          CLINIC_SYNC_DEVICE_KEY: ${{ secrets.CLINIC_SYNC_DEVICE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 59cf833536bd9a751546ecfc2cc649e3
