name: Deploy the Cloud copy

# Deploys the web app (the Cloud copy) to Cloudflare Workers whenever main
# changes. Cloudflare's own Git integration was never connected, so merges
# used to deploy nothing. Needs the repository secret CLOUDFLARE_API_TOKEN
# (a Cloudflare API token allowed to edit Workers Scripts and D1).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloud-copy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and deploy to Cloudflare Workers
        run: npx vinext-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 59cf833536bd9a751546ecfc2cc649e3
